name: Docker Image Publish

on:
  push:  
    tags:
      - "v*.*.*"

# Permite cancelar runs en progreso del mismo PR/ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      - name: Install dependencies
        run: poetry install --no-root --with dev
      - name: Run unit tests
        run: poetry run pytest -v


  # ── Build de release: construye y publica la imagen en Docker Hub ──────────
  build-and-publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set docker tag version
        # El tag del release (vX.Y.Z) ya viene en github.ref_name
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build and push image
        run: |
          IMAGE="keitarodxs/aia-jobs:${{ env.RELEASE_VERSION }}"
          docker build -t "$IMAGE" .
          docker tag "$IMAGE" keitarodxs/aia-jobs:latest
          docker push "$IMAGE"
          docker push keitarodxs/aia-jobs:latest
          docker logout

  # ── Despliegue continuo en nara (best-effort) ───────────────────────────────
  deploy-nara:
    needs: build-and-publish
    runs-on: [self-hosted, nara]
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Desplegar con docker run en nara
        env:
          AIA_JOBS_TAG: ${{ github.ref_name }}
        run: |
          set -e
          # Usa el tag del release (vX.Y.Z) que disparó el workflow
          TAG="${AIA_JOBS_TAG}"
          IMAGE="keitarodxs/aia-jobs:${TAG}"
          docker pull "$IMAGE"
          docker stop aia-jobs 2>/dev/null || true
          docker rm aia-jobs 2>/dev/null || true
          docker run -d --name aia-jobs --restart unless-stopped \
            --network=host \
            -v /opt/aia-jobs/logs:/app/logs \
            -e YAHOO_EMAIL="${{ secrets.YAHOO_EMAIL }}" \
            -e YAHOO_APP_PASSWORD="${{ secrets.YAHOO_APP_PASSWORD }}" \
            -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
            -e LISTENER_POLL_INTERVAL="${{ secrets.LISTENER_POLL_INTERVAL || '60' }}" \
            -e BCI_PDF_PASSWORD="${{ secrets.BCI_PDF_PASSWORD }}" \
            "$IMAGE"
          echo "Despliegue en nara completado (imagen: $IMAGE)"

  # ── Verificación post‑deploy en nara ──────────────────────────────────
  verify-nara:
    needs: deploy-nara
    runs-on: [self-hosted, nara]
    steps:
      - name: Esperar a que la API esté lista
        run: |
          for i in $(seq 1 12); do
            curl -sf http://localhost:8080/docs > /dev/null && break
            sleep 5
          done
      - name: Verificar API (Swagger + status + sync)
        run: |
          curl -sf http://localhost:8080/docs > /dev/null             && echo "✅ Swagger UI OK"             || (echo "❌ Swagger UI no responde" && exit 1)
          curl -sf http://localhost:8080/openapi.json | python3 -c "
          import sys,json; spec=json.load(sys.stdin)
          assert '/api/jobs/sync-historical-bci' in spec['paths']
          assert '/api/jobs/status' in spec['paths']
          print('✅ OpenAPI spec OK')
          "
          curl -sf http://localhost:8080/api/jobs/status | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          assert 'running' in d
          assert 'total_cartolas_bci' in d
          print('✅ API status OK:', d.get('total_cartolas_bci'), 'cartolas en BD')
          "
          curl -s --max-time 30 -X POST http://localhost:8080/api/jobs/sync-historical-bci             -H 'Content-Type: application/json'             -d '{"months_back": 1}' | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          assert 'transformed' in d or 'error' in d
          print('✅ Sync endpoint respondió:', d)
          "
