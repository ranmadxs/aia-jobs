name: PR Checks

on:
  pull_request:
    branches:
      - main

# Cancela runs obsoletos del mismo PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Cache Poetry packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      - name: Install dependencies
        run: poetry install --no-root --with dev
      - name: Run unit tests
        run: poetry run pytest -v

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Cache Poetry packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      - name: Install dependencies
        run: poetry install --no-root --with dev
      - name: Collect coverage
        run: |
          poetry run pytest --cov=listener --cov-fail-under=10 --cov-report=term-missing --cov-report=xml:coverage.xml -q
          poetry run python -m coverage report > coverage.md
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: coverage.md
      - name: Add coverage link to summary
        if: always()
        run: |
          repo="${{ github.repository }}"
          run_id="${{ github.run_id }}"
          link="https://github.com/${repo}/actions/runs/${run_id}/artifacts"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            printf '## Coverage report\n' >> "$GITHUB_STEP_SUMMARY"
            printf '- [Ver el reporte de cobertura](%s)\n' "$link" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "$link"
